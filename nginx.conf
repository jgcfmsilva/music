# Same-origin front door for the client. Upstreams are resolved per request (via
# Docker's embedded DNS) so nginx still starts if navidrome / music-api are down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OpenSubsonic API. Streaming: no buffering, Range passes through for seeking.
    location /rest/ {
        set $nd http://navidrome:4533;
        proxy_pass $nd;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /api/ {
        set $api http://music-api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_buffering off;             # /api/add/events is a live event stream
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
        try_files $uri /index.html;
    }
}
